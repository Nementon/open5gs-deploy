global:
  max:
    ue: 1024

logger:
  file: 
    path: /open5gs/logs/amf.log
  level: {{LOG_LEVEL}}

amf:
  time:
    t3512:
      value: 540
  sbi:
    server:
      - address: {{MY_IP}}
        port: 80
    client:
      nrf:
        - uri: http://{{NRF_IP}}:80
  ngap:
    server:
      - address: {{MY_IP}}
  guami:
    - plmn_id:
        mcc: {{MCC}}
        mnc: {{MNC}}
      amf_id:
        region: 2
        set: 1
        pointer: 1
  tai:
    - plmn_id:
        mcc: {{MCC}}
        mnc: {{MNC}}
      tac: {{TAC}}
  plmn_support:
    - plmn_id:
        mcc: {{MCC}}
        mnc: {{MNC}}
      s_nssai:
        - sst: {{SST}}
          sd: {{SD}}
  security:
    integrity_order : [ NIA2, NIA1, NIA0 ]
    ciphering_order : [ NEA0, NEA1, NEA2 ]
  amf_name: open5gs-amf1
