global:
  max:
    ue: 1024

logger:
  file: 
    path: /open5gs/logs/upf.log
  level: {{LOG_LEVEL}}

upf:
  pfcp:
    server:
      - address: {{MY_IP}}
  gtpu:
    server:
      - address: {{MY_IP}}
  session:
    - subnet: {{UE_SUBNET}}
      gateway: {{UE_GATEWAY}}
      dnn: internet
      dev: ogstun
