services:

  # BEGIN: Shared, O&M Components
  mongodb:
    image: mongo:${MONGODB_VERSION:-6.0}
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-}
    volumes:
      - mongodb_data:/data/db
    networks:
      - open5gs-net
    ports:
      - "${MONGODB_PORT:-27017}:27017"

  webui:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: webui
    depends_on:
      - mongodb
    environment:
      - DB_URI=${DB_URI:-mongodb://mongodb:27017/open5gs}
      - PROVISION_SUBSCRIBERS=${PROVISION_SUBSCRIBERS:-false}
      - MCC=${MCC:-999}
      - MNC=${MNC:-70}
      - SST=${SST:-1}
      - SD=${SD:-ffffff}
      - OPEN5GS_UID=${OPEN5GS_UID:-9999}
      - OPEN5GS_GID=${OPEN5GS_GID:-9999}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${WEBUI_PORT:-9999}:9999"
    networks:
      - open5gs-net
  # END: Shared, O&M Components

  # BEGIN 5G Components
  nrf:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: nrf
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OPEN5GS_UID=${OPEN5GS_UID:-9999}
      - OPEN5GS_GID=${OPEN5GS_GID:-9999}
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    networks:
      - open5gs-net

  udr:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: udr
    depends_on:
      - mongodb
      - nrf
    environment:
      - DB_URI=${DB_URI:-mongodb://mongodb:27017/open5gs}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OPEN5GS_UID=${OPEN5GS_UID:-9999}
      - OPEN5GS_GID=${OPEN5GS_GID:-9999}
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    networks:
      - open5gs-net

  udm:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: udm
    depends_on:
      - nrf
      - udr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OPEN5GS_UID=${OPEN5GS_UID:-9999}
      - OPEN5GS_GID=${OPEN5GS_GID:-9999}
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    networks:
      - open5gs-net

  ausf:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: ausf
    depends_on:
      - nrf
      - udm
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OPEN5GS_UID=${OPEN5GS_UID:-9999}
      - OPEN5GS_GID=${OPEN5GS_GID:-9999}
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    networks:
      - open5gs-net

  nssf:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: nssf
    depends_on:
      - nrf
    environment:
      - SST=${SST:-1}
      - SD=${SD:-ffffff}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OPEN5GS_UID=${OPEN5GS_UID:-9999}
      - OPEN5GS_GID=${OPEN5GS_GID:-9999}
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    networks:
      - open5gs-net

  pcf:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: pcf
    depends_on:
      - mongodb
      - nrf
    environment:
      - DB_URI=${DB_URI:-mongodb://mongodb:27017/open5gs}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MCC=${MCC:-999}
      - MNC=${MNC:-70}
      - SST=${SST:-1}
      - SD=${SD:-ffffff}
      - OPEN5GS_UID=${OPEN5GS_UID:-9999}
      - OPEN5GS_GID=${OPEN5GS_GID:-9999}
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    networks:
      - open5gs-net

  bsf:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: bsf
    depends_on:
      - nrf
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OPEN5GS_UID=${OPEN5GS_UID:-9999}
      - OPEN5GS_GID=${OPEN5GS_GID:-9999}
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    networks:
      - open5gs-net

  amf:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: amf
    depends_on:
      - nrf
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MCC=${MCC:-999}
      - MNC=${MNC:-70}
      - TAC=${TAC:-1}
      - SST=${SST:-1}
      - SD=${SD:-ffffff}
      - OPEN5GS_UID=${OPEN5GS_UID:-9999}
      - OPEN5GS_GID=${OPEN5GS_GID:-9999}
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    ports:
      # NGAP interface for gNB connection (SCTP)
      - "${AMF_NGAP_PORT:-38412}:38412/sctp"
    networks:
      - open5gs-net

  upf:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: upf
    depends_on:
      - nrf
    environment:
      - UE_SUBNET=${UE_SUBNET:-10.45.0.0/16}
      - UE_GATEWAY=${UE_GATEWAY:-10.45.0.1}
      - ENABLE_UE_EGRESS_ISOLATION=${ENABLE_UE_EGRESS_ISOLATION:-false}
      - UE_ALLOWED_PRIVATE_EGRESS_SUBNETS=${UE_ALLOWED_PRIVATE_EGRESS_SUBNETS:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OPEN5GS_UID=${OPEN5GS_UID:-9999}
      - OPEN5GS_GID=${OPEN5GS_GID:-9999}
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    ports:
      # GTP-U interface for User Plane traffic (UDP)
      - "${UPF_GTPU_PORT:-2152}:2152/udp"
    networks:
      - open5gs-net

  smf:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: smf
    depends_on:
      - nrf
      - amf
      - upf
      - pcrf
    environment:
      - UE_SUBNET=${UE_SUBNET:-10.45.0.0/16}
      - UE_GATEWAY=${UE_GATEWAY:-10.45.0.1}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OPEN5GS_UID=${OPEN5GS_UID:-9999}
      - OPEN5GS_GID=${OPEN5GS_GID:-9999}
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    networks:
      - open5gs-net
  # END: 5G Components

  # BEGIN: 4G Components
  pcrf:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: pcrf
    depends_on:
      - mongodb
      - nrf
    environment:
      - DB_URI=${DB_URI:-mongodb://mongodb:27017/open5gs}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OPEN5GS_UID=${OPEN5GS_UID:-9999}
      - OPEN5GS_GID=${OPEN5GS_GID:-9999}
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    networks:
      - open5gs-net

  hss:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: hss
    depends_on:
      - mongodb
    environment:
      - DB_URI=${DB_URI:-mongodb://mongodb:27017/open5gs}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OPEN5GS_UID=${OPEN5GS_UID:-9999}
      - OPEN5GS_GID=${OPEN5GS_GID:-9999}
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    networks:
      - open5gs-net

  mme:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: mme
    depends_on:
      - hss
      - smf
      - sgwc
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MCC=${MCC:-999}
      - MNC=${MNC:-70}
      - MME_GID=${MME_GID:-2}
      - MME_CODE=${MME_CODE:-1}
      - TAC=${TAC:-1}
      - OPEN5GS_UID=${OPEN5GS_UID:-9999}
      - OPEN5GS_GID=${OPEN5GS_GID:-9999}
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    ports:
      # S1AP interface for eNodeB connection (SCTP)
      - "${MME_S1AP_PORT:-36412}:36412/sctp"
    networks:
      - open5gs-net

  sgwc:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: sgwc
    depends_on:
      - sgwu
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OPEN5GS_UID=${OPEN5GS_UID:-9999}
      - OPEN5GS_GID=${OPEN5GS_GID:-9999}
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    networks:
      - open5gs-net

  sgwu:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: sgwu
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OPEN5GS_UID=${OPEN5GS_UID:-9999}
      - OPEN5GS_GID=${OPEN5GS_GID:-9999}
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    networks:
      - open5gs-net    
  # END: 4G Components

volumes:
  mongodb_data:

networks:
  open5gs-net:
    driver: bridge
