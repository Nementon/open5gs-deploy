services:
  mongodb:
    image: mongo:${MONGODB_VERSION:-6.0}
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-}
    volumes:
      - mongodb_data:/data/db
    networks:
      - open5gs-net
    ports:
      - "${MONGODB_PORT:-27017}:27017"

  nrf:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: nrf
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    networks:
      - open5gs-net

  udr:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: udr
    depends_on:
      - mongodb
      - nrf
    environment:
      - DB_URI=${DB_URI:-mongodb://mongodb:27017/open5gs}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    networks:
      - open5gs-net

  udm:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: udm
    depends_on:
      - nrf
      - udr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    networks:
      - open5gs-net

  ausf:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: ausf
    depends_on:
      - nrf
      - udm
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    networks:
      - open5gs-net

  nssf:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: nssf
    depends_on:
      - nrf
    environment:
      - SST=${SST:-1}
      - SD=${SD:-ffffff}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    networks:
      - open5gs-net

  pcf:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: pcf
    depends_on:
      - mongodb
      - nrf
    environment:
      - DB_URI=${DB_URI:-mongodb://mongodb:27017/open5gs}
      - MCC=${MCC:-999}
      - MNC=${MNC:-70}
      - SST=${SST:-1}
      - SD=${SD:-ffffff}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    networks:
      - open5gs-net

  bsf:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: bsf
    depends_on:
      - nrf
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    networks:
      - open5gs-net

  amf:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: amf
    depends_on:
      - nrf
    environment:
      - MCC=${MCC:-999}
      - MNC=${MNC:-70}
      - TAC=${TAC:-1}
      - SST=${SST:-1}
      - SD=${SD:-ffffff}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    ports:
      # NGAP interface for gNB connection (SCTP)
      - "${AMF_NGAP_PORT:-38412}:38412/sctp"
    networks:
      - open5gs-net

  upf:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: upf
    depends_on:
      - nrf
    environment:
      - UE_SUBNET=${UE_SUBNET:-10.45.0.0/16}
      - UE_GATEWAY=${UE_GATEWAY:-10.45.0.1}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    ports:
      # GTP-U interface for User Plane traffic (UDP)
      - "${UPF_GTPU_PORT:-2152}:2152/udp"
    networks:
      - open5gs-net

  smf:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: smf
    depends_on:
      - nrf
      - amf
      - upf
    environment:
      - UE_SUBNET=${UE_SUBNET:-10.45.0.0/16}
      - UE_GATEWAY=${UE_GATEWAY:-10.45.0.1}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - "${LOGS_DIR:-./logs}:/open5gs/logs"
    networks:
      - open5gs-net

  webui:
    build:
      context: ${COMPOSE_CONTEXT:-.}
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION:-v2.7.2}
    image: open5gs-deploy:${OPEN5GS_VERSION:-v2.7.2}
    restart: unless-stopped
    command: webui
    depends_on:
      - mongodb
    environment:
      - DB_URI=mongodb://mongodb:27017/open5gs
      - HOSTNAME=0.0.0.0
      - PORT=9999
      - PROVISION_SUBSCRIBERS=${PROVISION_SUBSCRIBERS:-false}
      - MCC=${MCC:-999}
      - MNC=${MNC:-70}
      - SST=${SST:-1}
      - SD=${SD:-ffffff}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${WEBUI_PORT:-9999}:9999"
    networks:
      - open5gs-net

volumes:
  mongodb_data:

networks:
  open5gs-net:
    driver: bridge
