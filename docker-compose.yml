services:
  mongodb:
    image: mongo:${MONGODB_VERSION}
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - open5gs-net
    ports:
      - "${MONGODB_PORT:-27017}:27017"

  nrf:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION}
    image: open5gs-deploy:${OPEN5GS_VERSION}
    restart: unless-stopped
    command: nrf
    volumes:
      - ./config:/open5gs/config:ro
      - ./logs:/open5gs/logs
    networks:
      - open5gs-net

  udr:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION}
    image: open5gs-deploy:${OPEN5GS_VERSION}
    restart: unless-stopped
    command: udr
    depends_on:
      - mongodb
      - nrf
    volumes:
      - ./config:/open5gs/config:ro
      - ./logs:/open5gs/logs
    networks:
      - open5gs-net

  udm:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION}
    image: open5gs-deploy:${OPEN5GS_VERSION}
    restart: unless-stopped
    command: udm
    depends_on:
      - nrf
      - udr
    volumes:
      - ./config:/open5gs/config:ro
      - ./logs:/open5gs/logs
    networks:
      - open5gs-net

  ausf:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION}
    image: open5gs-deploy:${OPEN5GS_VERSION}
    restart: unless-stopped
    command: ausf
    depends_on:
      - nrf
      - udm
    volumes:
      - ./config:/open5gs/config:ro
      - ./logs:/open5gs/logs
    networks:
      - open5gs-net

  nssf:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION}
    image: open5gs-deploy:${OPEN5GS_VERSION}
    restart: unless-stopped
    command: nssf
    depends_on:
      - nrf
    volumes:
      - ./config:/open5gs/config:ro
      - ./logs:/open5gs/logs
    networks:
      - open5gs-net

  pcf:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION}
    image: open5gs-deploy:${OPEN5GS_VERSION}
    restart: unless-stopped
    command: pcf
    depends_on:
      - nrf
    volumes:
      - ./config:/open5gs/config:ro
      - ./logs:/open5gs/logs
    networks:
      - open5gs-net

  bsf:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION}
    image: open5gs-deploy:${OPEN5GS_VERSION}
    restart: unless-stopped
    command: bsf
    depends_on:
      - nrf
    volumes:
      - ./config:/open5gs/config:ro
      - ./logs:/open5gs/logs
    networks:
      - open5gs-net

  amf:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION}
    image: open5gs-deploy:${OPEN5GS_VERSION}
    restart: unless-stopped
    command: amf
    depends_on:
      - nrf
    volumes:
      - ./config:/open5gs/config:ro
      - ./logs:/open5gs/logs
    ports:
      # NGAP interface for gNB connection (SCTP)
      - "${AMF_NGAP_PORT:-38412}:38412/sctp"
    networks:
      - open5gs-net

  upf:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION}
    image: open5gs-deploy:${OPEN5GS_VERSION}
    restart: unless-stopped
    command: upf
    depends_on:
      - nrf
    environment:
      - UE_SUBNET=${UE_SUBNET}
      - UE_GATEWAY=${UE_GATEWAY}
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    volumes:
      - ./config:/open5gs/config:ro
      - ./logs:/open5gs/logs
    ports:
      # GTP-U interface for User Plane traffic (UDP)
      - "${UPF_GTPU_PORT:-2152}:2152/udp"
    networks:
      - open5gs-net

  smf:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION}
    image: open5gs-deploy:${OPEN5GS_VERSION}
    restart: unless-stopped
    command: smf
    depends_on:
      - nrf
      - amf
      - upf
    volumes:
      - ./config:/open5gs/config:ro
      - ./logs:/open5gs/logs
    networks:
      - open5gs-net

  webui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - OPEN5GS_VERSION=${OPEN5GS_VERSION}
    image: open5gs-deploy:${OPEN5GS_VERSION}
    restart: unless-stopped
    command: webui
    depends_on:
      - mongodb
    environment:
      - DB_URI=mongodb://mongodb:27017/open5gs
      - HOSTNAME=0.0.0.0
      - PORT=9999
    ports:
      - "${WEBUI_PORT:-9999}:9999"
    networks:
      - open5gs-net

volumes:
  mongodb_data:

networks:
  open5gs-net:
    driver: bridge
