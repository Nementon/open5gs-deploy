global:
  max:
    ue: 1024

logger:
  file: /open5gs/logs/smf.log
  level: info

smf:
  gtpu:
    server:
      - address: {{MY_IP}}
  sbi:
    server:
      - address: {{MY_IP}}
        port: 7777
    client:
      nrf:
        - uri: http://{{NRF_IP}}:7777
  pfcp:
    server:
      - address: {{MY_IP}}
    client:
      upf:
        - address: {{UPF_IP}}
  session:
    - subnet: 10.45.0.1/16
      dnn: internet
  dns:
    - 8.8.8.8
    - 8.8.4.4
